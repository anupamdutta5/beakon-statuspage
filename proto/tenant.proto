syntax = "proto3";

package tenant;

option go_package = "github.com/enterprise-status/statuspage/proto/tenant";

import "google/protobuf/timestamp.proto";

// Tenant service definition
service TenantService {
  // Get tenant by ID
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  
  // Create a new tenant
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  
  // Update tenant
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  
  // Delete tenant
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  
  // List tenants
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  
  // Get tenant by domain
  rpc GetTenantByDomain(GetTenantByDomainRequest) returns (GetTenantByDomainResponse);
  
  // Validate tenant access
  rpc ValidateTenantAccess(ValidateTenantAccessRequest) returns (ValidateTenantAccessResponse);
}

// Tenant message
message Tenant {
  uint32 id = 1;
  string name = 2;
  string domain = 3;
  string subdomain = 4;
  string plan = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// GetTenantRequest
message GetTenantRequest {
  uint32 tenant_id = 1;
}

// GetTenantResponse
message GetTenantResponse {
  Tenant tenant = 1;
  bool success = 2;
  string error_message = 3;
}

// CreateTenantRequest
message CreateTenantRequest {
  string name = 1;
  string domain = 2;
  string subdomain = 3;
  string plan = 4;
}

// CreateTenantResponse
message CreateTenantResponse {
  Tenant tenant = 1;
  bool success = 2;
  string error_message = 3;
}

// UpdateTenantRequest
message UpdateTenantRequest {
  uint32 tenant_id = 1;
  string name = 2;
  string domain = 3;
  string subdomain = 4;
  string plan = 5;
  bool is_active = 6;
}

// UpdateTenantResponse
message UpdateTenantResponse {
  Tenant tenant = 1;
  bool success = 2;
  string error_message = 3;
}

// DeleteTenantRequest
message DeleteTenantRequest {
  uint32 tenant_id = 1;
}

// DeleteTenantResponse
message DeleteTenantResponse {
  bool success = 1;
  string error_message = 2;
}

// ListTenantsRequest
message ListTenantsRequest {
  uint32 page = 1;
  uint32 limit = 2;
  string search = 3;
}

// ListTenantsResponse
message ListTenantsResponse {
  repeated Tenant tenants = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 limit = 4;
  bool success = 5;
  string error_message = 6;
}

// GetTenantByDomainRequest
message GetTenantByDomainRequest {
  string domain = 1;
}

// GetTenantByDomainResponse
message GetTenantByDomainResponse {
  Tenant tenant = 1;
  bool success = 2;
  string error_message = 3;
}

// ValidateTenantAccessRequest
message ValidateTenantAccessRequest {
  uint32 tenant_id = 1;
  uint32 user_id = 2;
}

// ValidateTenantAccessResponse
message ValidateTenantAccessResponse {
  bool has_access = 1;
  string error_message = 2;
}
