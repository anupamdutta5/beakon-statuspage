<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Test</title>
    <style>
        .sidebar { width: 200px; float: left; }
        .nav-link { display: block; padding: 10px; text-decoration: none; color: #333; }
        .nav-link:hover { background: #f0f0f0; }
        .nav-item.active .nav-link { background: #007bff; color: white; }
        .content-section { display: none; padding: 20px; }
        .content-section.active { display: block; }
        .main-content { margin-left: 220px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <ul class="sidebar-nav">
            <li class="nav-item active">
                <a href="#dashboard" class="nav-link">Dashboard</a>
            </li>
            <li class="nav-item">
                <a href="#incidents" class="nav-link">Incidents</a>
            </li>
            <li class="nav-item">
                <a href="#components" class="nav-link">Components</a>
            </li>
        </ul>
    </div>
    
    <div class="main-content">
        <div id="dashboard" class="content-section active">
            <h2>Dashboard</h2>
            <p>This is the dashboard content.</p>
        </div>
        <div id="incidents" class="content-section">
            <h2>Incidents</h2>
            <p>This is the incidents content.</p>
        </div>
        <div id="components" class="content-section">
            <h2>Components</h2>
            <p>This is the components content.</p>
        </div>
    </div>

    <script>
        // Simple navigation test
        document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const href = link.getAttribute('href');
                
                if (href.startsWith('#')) {
                    const section = href.substring(1);
                    
                    // Update active nav item
                    document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    link.closest('.nav-item').classList.add('active');
                    
                    // Hide all content sections
                    document.querySelectorAll('.content-section').forEach(section => {
                        section.classList.remove('active');
                    });
                    
                    // Show the selected section
                    const targetSection = document.getElementById(section);
                    if (targetSection) {
                        targetSection.classList.add('active');
                    }
                    
                    console.log('Navigated to:', section);
                }
            });
        });
    </script>
</body>
</html>
