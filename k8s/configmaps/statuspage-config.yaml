apiVersion: v1
kind: ConfigMap
metadata:
  name: statuspage-config
  namespace: statuspage
data:
  # Server Configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_READ_TIMEOUT: "30s"
  SERVER_WRITE_TIMEOUT: "30s"
  SERVER_IDLE_TIMEOUT: "300s"
  
  # Database Configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "statuspage_prod"
  DB_SSLMODE: "require"
  DB_MAX_CONNS: "100"
  DB_MIN_CONNS: "10"
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "50"
  
  # JWT Configuration
  JWT_EXPIRES_IN: "1h"
  JWT_REFRESH_IN: "24h"
  JWT_ISSUER: "statuspage.io"
  JWT_AUDIENCE: "statuspage-api"
  
  # Email Configuration
  EMAIL_PROVIDER: "sendgrid"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@statuspage.io"
  SMTP_USE_TLS: "true"
  SENDGRID_FROM: "noreply@statuspage.io"
  
  # Payment Configuration
  PAYMENT_DEFAULT_PROVIDER: "stripe"
  
  # Monitoring Configuration
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  PROMETHEUS_PATH: "/metrics"
  JAEGER_ENABLED: "true"
  JAEGER_ENDPOINT: "http://jaeger-collector:14268/api/traces"
  JAEGER_SERVICE_NAME: "statuspage"
  INFLUX_URL: "http://influxdb:8086"
  INFLUX_ORG: "statuspage"
  INFLUX_BUCKET: "metrics"
  
  # Security Configuration
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RATE: "1000"
  RATE_LIMIT_BURST: "2000"
  RATE_LIMIT_WINDOW: "1m"
  ENCRYPTION_ALGORITHM: "AES-256-GCM"
  SESSION_MAX_AGE: "1h"
  SESSION_SECURE: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SAME_SITE: "Strict"
  
  # Service Discovery Configuration
  SERVICE_DISCOVERY_PROVIDER: "consul"
  CONSUL_ADDR: "consul:8500"
  CONSUL_DC: "dc1"
  
  # Kafka Configuration
  KAFKA_BROKERS: "kafka:9092"
  
  # Tracing Configuration
  TRACING_ENABLED: "true"
  TRACING_SERVICE_NAME: "statuspage"
  TRACING_ENDPOINT: "http://jaeger-collector:14268/api/traces"
  TRACING_SAMPLE_RATE: "0.1"
  
  # Logging Configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_OUTPUT: "stdout"
  LOG_MAX_SIZE: "100"
  LOG_MAX_BACKUPS: "10"
  LOG_MAX_AGE: "30"
  LOG_COMPRESS: "true"
  
  # Environment
  ENVIRONMENT: "production"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: statuspage-cors-config
  namespace: statuspage
data:
  cors-config.json: |
    {
      "allowed_origins": [
        "https://statuspage.io",
        "https://app.statuspage.io"
      ],
      "allowed_methods": [
        "GET",
        "POST",
        "PUT",
        "DELETE",
        "OPTIONS"
      ],
      "allowed_headers": [
        "Authorization",
        "Content-Type",
        "X-Requested-With"
      ],
      "allow_credentials": true
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: statuspage-kafka-topics
  namespace: statuspage
data:
  kafka-topics.json: |
    {
      "incidents": "incidents",
      "notifications": "notifications",
      "analytics": "analytics",
      "payments": "payments"
    }
