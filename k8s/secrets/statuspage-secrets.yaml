apiVersion: v1
kind: Secret
metadata:
  name: statuspage-secrets
  namespace: statuspage
type: Opaque
data:
  # Database Configuration
  db-password: <base64-encoded-db-password>
  db-user: <base64-encoded-db-user>
  
  # JWT Configuration
  jwt-secret: <base64-encoded-jwt-secret>
  
  # Email Configuration
  smtp-password: <base64-encoded-smtp-password>
  smtp-username: <base64-encoded-smtp-username>
  sendgrid-api-key: <base64-encoded-sendgrid-api-key>
  
  # Payment Configuration
  stripe-secret-key: <base64-encoded-stripe-secret-key>
  stripe-webhook-secret: <base64-encoded-stripe-webhook-secret>
  stripe-publishable-key: <base64-encoded-stripe-publishable-key>
  paypal-client-id: <base64-encoded-paypal-client-id>
  paypal-client-secret: <base64-encoded-paypal-client-secret>
  
  # Security Configuration
  encryption-key: <base64-encoded-encryption-key>
  session-secret: <base64-encoded-session-secret>
  
  # Monitoring Configuration
  influx-token: <base64-encoded-influx-token>
  
  # Service Discovery Configuration
  consul-token: <base64-encoded-consul-token>
  
  # Redis Configuration
  redis-password: <base64-encoded-redis-password>

---
apiVersion: v1
kind: Secret
metadata:
  name: statuspage-tls
  namespace: statuspage
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-tls-certificate>
  tls.key: <base64-encoded-tls-private-key>
