version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: statuspage-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: statuspage_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d statuspage_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Status Page Application (Development)
  statuspage:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: statuspage-app-dev
    environment:
      # Development Configuration
      ENVIRONMENT: development
      SERVER_PORT: 8080
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: statuspage_dev
      DB_SSLMODE: disable
      
      # JWT Configuration
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRES_IN: 24
      
      # Email Configuration (Log only for development)
      USE_SMTP: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app
    command: ["go", "run", "cmd/api/main.go"]

volumes:
  postgres_dev_data:
    driver: local

networks:
  default:
    name: statuspage-dev-network
