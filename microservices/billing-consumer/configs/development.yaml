environment: development

consumer:
  name: billing-consumer
  version: 1.0.0
  description: Billing Consumer for StatusPage
  tags:
    - billing
    - consumer
    - event-driven
  metadata:
    owner: platform-team
    maintainer: devops@company.com

kafka:
  brokers:
    - localhost:9092
  group_id: billing-consumer-dev
  auto_offset_reset: earliest
  enable_auto_commit: true

database: test_db
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  user: ${DB_USER:statuspage_user}
  password: ${DB_PASSWORD}
  name: ${DB_NAME:statuspage_billing_consumer
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_idle: 10
  max_lifetime: 3600

cache:
  provider: redis
  host: ${DB_HOST:localhost}
  port: 6379
  password: ""
  db: 0
  ttl: 300
  key_prefix: "statuspage:billing-consumer"

logging:
  level: ${LOG_LEVEL:debug}
  format: json
  output: stdout

processing:
  batch_size: 100
  max_retries: 3
  retry_delay: 5s
  timeout: 30s

billing:
  stripe:
    secret_key: sk_test_your-stripe-secret-key
    webhook_secret: whsec_your-webhook-secret
  paypal:
    client_id: your-paypal-client-id
    client_secret: your-paypal-client-secret
    mode: sandbox
