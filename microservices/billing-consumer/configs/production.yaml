environment: production

consumer:
  name: billing-consumer
  version: 1.0.0
  description: Billing Consumer for StatusPage
  tags:
    - billing
    - consumer
    - event-driven
  metadata:
    owner: platform-team
    maintainer: devops@company.com

kafka:
  brokers:
    - ${KAFKA_BROKERS}
  group_id: billing-consumer-prod
  auto_offset_reset: latest
  enable_auto_commit: true

database: test_db
  host: localhost
  port: 5432
  user: test_user
  password: test_password
  name: ${DB_NAME}
  ssl_mode: require
  max_conns: 100
  min_conns: 10
  max_idle: 20
  max_lifetime: 3600

cache:
  provider: redis
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 0
  ttl: 300
  key_prefix: "statuspage:billing-consumer"

logging:
  level: info
  format: json
  output: stdout

processing:
  batch_size: 1000
  max_retries: 5
  retry_delay: 10s
  timeout: 60s

billing:
  stripe:
    secret_key: ${STRIPE_SECRET_KEY}
    webhook_secret: ${STRIPE_WEBHOOK_SECRET}
  paypal:
    client_id: ${PAYPAL_CLIENT_ID}
    client_secret: ${PAYPAL_CLIENT_SECRET}
    mode: live

