services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: billing_consumer_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d billing_consumer_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-consumer-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=billing_consumer_test
      - KAFKA_BROKERS=host.docker.internal:9092
      - KAFKA_GROUP_ID=billing-consumer-test
      - KAFKA_TOPIC=billing-events
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests
      - ./coverage:/app/coverage
    command: ["go", "test", "-v", "./tests/...", "-coverprofile=coverage.out"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data: