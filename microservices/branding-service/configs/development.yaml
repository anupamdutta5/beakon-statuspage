environment: development

service:
  name: branding-service
  version: 1.0.0
  description: Branding Service for StatusPage
  tags:
    - branding
    - microservice
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database: test_db
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  user: ${DB_USER:statuspage_user}
  password: ${DB_PASSWORD}
  name: ${DB_NAME:statuspage_branding
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_idle: 10
  max_lifetime: 3600

cache:
  provider: redis
  host: ${DB_HOST:localhost}
  port: 6379
  password: ""
  db: 0
  ttl: 300
  key_prefix: "statuspage:branding-service"

logging:
  level: ${LOG_LEVEL:debug}
  format: json
  output: stdout

jwt:
  secret: ${JWT_SECRET}
  expiration: 24
  issuer: statuspage-dev

monitoring:
  enabled: true
  metrics_port: ${DB_PORT:5432}
  health_port: ${DB_PORT:5432}
  log_level: ${LOG_LEVEL:debug}

storage:
  provider: local
  path: ./uploads/branding
  max_file_size: 10MB
  allowed_types:
    - image/jpeg
    - image/png
    - image/svg+xml
