environment: production

service:
  name: branding-service
  version: 1.0.0
  description: Branding Service for StatusPage
  tags:
    - branding
    - microservice
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: localhost
  port: 5432
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database: test_db
  host: localhost
  port: 5432
  user: test_user
  password: ${DB_PASSWORD}
  name: ${DB_NAME}
  ssl_mode: require
  max_conns: 100
  min_conns: 10
  max_idle: 20
  max_lifetime: 3600

cache:
  provider: redis
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 0
  ttl: 300
  key_prefix: "statuspage:branding-service"

logging:
  level: info
  format: json
  output: stdout

jwt:
  secret: ${JWT_SECRET}
  expiration: 24
  issuer: statuspage-prod

monitoring:
  enabled: true
  metrics_port: 5432
  health_port: 5432
  log_level: info

storage:
  provider: s3
  bucket: ${AWS_S3_BUCKET}
  region: ${AWS_REGION}
  access_key: ${AWS_ACCESS_KEY_ID}
  secret_key: ${AWS_SECRET_ACCESS_KEY}
  max_file_size: 10MB
  allowed_types:
    - image/jpeg
    - image/png
    - image/svg+xml
