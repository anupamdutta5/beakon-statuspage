environment: development

service:
  name: notification-service
  version: 1.0.0
  description: Notification Service for StatusPage
  tags:
    - notification
    - microservice
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: 0.0.0.0
  port: 8095
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database:
  host: localhost
  port: 5432
  user: postgres
  password: password
  name: statuspage_notification
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_idle: 10
  max_lifetime: 3600

cache:
  provider: redis
  host: localhost
  port: 6379
  password: ""
  db: 0
  ttl: 300

logging:
  level: debug
  format: json
  output: stdout

jwt:
  secret: dev-secret-key-change-in-production
  expiration: 24
  issuer: statuspage-dev

monitoring:
  enabled: true
  metrics_port: 9095
  health_port: 10095
  log_level: debug

email:
  provider: smtp
  smtp_host: localhost
  smtp_port: 1025
  smtp_username: ""
  smtp_password: ""
  from_email: noreply@statuspage.dev

sms:
  provider: twilio
  account_sid: test-account-sid
  auth_token: test-auth-token
  from_number: "+1234567890"
