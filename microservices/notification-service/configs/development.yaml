environment: development

service:
  name: notification-service
  version: 1.0.0
  description: Notification Service for StatusPage
  tags:
    - notification
    - microservice
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: ${SERVER_HOST:localhost}
  port: ${SERVER_PORT:8085}
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  user: ${DB_USER:statuspage_user}
  password: ${DB_PASSWORD}
  name: ${DB_NAME:statuspage_notification}
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_idle: 10
  max_lifetime: 3600

# API Gateway configuration - all inter-service calls should route through gateway
api_gateway:
  url: ${API_GATEWAY_URL:http://localhost:8080}

cache:
  provider: redis
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  db: 0
  ttl: 300
  key_prefix: "statuspage:notification-service"

logging:
  level: ${LOG_LEVEL:debug}
  format: json
  output: stdout

jwt:
  secret: ${JWT_SECRET}
  expiration: 24
  issuer: statuspage-dev

monitoring:
  enabled: true
  metrics_port: ${METRICS_PORT:9097}
  health_port: ${SERVER_PORT:8097}
  log_level: ${LOG_LEVEL:debug}

email:
  provider: smtp
  smtp_host: ${SMTP_HOST:localhost}
  smtp_port: ${SMTP_PORT:587}
  smtp_username: ${SMTP_USERNAME:}
  smtp_password: ${SMTP_PASSWORD}
  from_email: noreply@statuspage.dev

sms:
  provider: twilio
  account_sid: ${TWILIO_ACCOUNT_SID:test-account-sid}
  auth_token: ${TWILIO_AUTH_TOKEN:test-auth-token}
  from_number: ${TWILIO_FROM_NUMBER:+1234567890}

features:
  use_database_service: ${FEATURE_USE_DATABASE_SERVICE:false}
