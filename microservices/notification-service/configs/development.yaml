environment: development

service:
  name: notification-service
  version: 1.0.0
  description: Notification Service for StatusPage
  tags:
    - notification
    - microservice
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database: test_db
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  user: ${DB_USER:statuspage_user}
  password: ${DB_PASSWORD}
  name: ${DB_NAME:statuspage_notification
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_idle: 10
  max_lifetime: 3600

cache:
  provider: redis
  host: ${DB_HOST:localhost}
  port: 6379
  password: ""
  db: 0
  ttl: 300
  key_prefix: "statuspage:notification-service"

logging:
  level: ${LOG_LEVEL:debug}
  format: json
  output: stdout

jwt:
  secret: ${JWT_SECRET}
  expiration: 24
  issuer: statuspage-dev

monitoring:
  enabled: true
  metrics_port: ${DB_PORT:5432}
  health_port: ${DB_PORT:5432}
  log_level: ${LOG_LEVEL:debug}

email:
  provider: smtp
  smtp_host: ${DB_HOST:localhost}
  smtp_port: ${DB_PORT:5432}
  smtp_username: ""
  smtp_password: ${DB_PASSWORD}
  from_email: noreply@statuspage.dev

sms:
  provider: twilio
  account_sid: test-account-sid
  auth_token: test-auth-token
  from_number: "+1234567890"
