# notification-service - Test Configuration
# This file contains configuration for unit/integration tests
# Tests use SQLite in-memory database and mock external services

service:
  name: notification-service
  version: 1.0.0-test
  environment: test

server:
  port: 8085
  host: localhost
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  graceful_stop: 5s

database:
  # Tests use SQLite in-memory, these values are ignored
  host: localhost
  port: 5432
  user: test
  password: test
  name: ":memory:"  # SQLite in-memory
  ssl_mode: disable
  max_conns: 10
  min_conns: 1
  max_open_conns: 10
  max_idle_conns: 4
  conn_max_lifetime: 300s
  conn_max_idle_time: 60s

redis:
  enabled: false  # Disabled for unit tests
  host: localhost
  port: 6379
  password: ""
  db: 1  # Different DB for tests
  max_retries: 1
  pool_size: 5
  min_idle_conns: 1
  key_prefix: "test:notification-service:"

rabbitmq:
  # Disabled for unit tests
  host: localhost
  port: 5672
  user: test
  password: test
  vhost: /
  exchange: test-exchange
  queue: test-queue

jwt:
  secret: "test-jwt-secret-min-32-chars-for-unit-testing-only"
  expiration: 1h
  refresh_expiration: 24h
  issuer: notification-service-test
  audience: test-api

session:
  cookie_name: session_test
  cookie_domain: localhost
  cookie_secure: false
  cookie_http_only: true
  cookie_same_site: lax
  max_age: 3600

# Circuit breaker configuration
circuit_breaker:
  name: test-circuit-breaker
  max_requests: 5
  interval: 5s
  timeout: 30s
  failure_ratio: 0.8
  min_requests: 3
  enabled: false  # Disabled for unit tests

# Service client configuration
service_client:
  timeout: 10s
  circuit_breaker:
    name: service-client-test
    max_requests: 5
    interval: 5s
    timeout: 30s
    failure_ratio: 0.8
    min_requests: 3
    enabled: false  # Disabled for unit tests

# Retry configuration
retry:
  max_retries: 2
  initial_delay: 50ms
  max_delay: 1s
  backoff_factor: 1.5
  jitter: true
  retryable_errors:
    - "connection refused"
    - "timeout"

# Cache configuration
cache:
  enabled: false  # Disabled for unit tests
  default_ttl: 1m
  max_size: 100
  cleanup_interval: 5m
  type: memory

# Rate limiting
rate_limit:
  enabled: false  # Disabled for unit tests
  requests_per_minute: 10000
  burst: 1000
  cleanup_interval: 5m
  redis_key_prefix: "rate_limit:test:"
  excluded_paths:
    - /health
    - /health/live
    - /health/ready
    - /metrics

logging:
  level: error  # Less verbose in tests
  format: console
  output: stdout
  error_output: stderr

cors:
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3001
    - http://localhost:3002
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed_headers:
    - "*"
  allow_credentials: true
  max_age: 3600
  expose_headers:
    - "*"

security:
  sanitization_enabled: true
  max_string_length: 1000
  strict_mode: false  # Less strict for tests
  allowed_file_types:
    - jpg
    - jpeg
    - png
    - gif
    - pdf
  max_file_size: 10485760  # 10MB
  security_headers_enabled: false  # Not needed in tests

monitoring:
  enabled: false  # No metrics in unit tests
  metrics_enabled: false
  tracing_enabled: false
  metrics_path: /metrics
  health_path: /health
