# Redis Sentinel Configuration for High Availability
# Monitors Redis master and automatically promotes replicas on failure

port 26379

# Monitor the master
# sentinel monitor <master-name> <ip> <port> <quorum>
# Quorum: number of sentinels that need to agree about master being down
sentinel monitor beakon-master redis-master 6379 2

# Password for master
sentinel auth-pass beakon-master CHANGE_THIS_TO_STRONG_PASSWORD_MIN_32_CHARS

# Master down detection
sentinel down-after-milliseconds beakon-master 5000

# Failover timeout
sentinel failover-timeout beakon-master 60000

# Parallel syncs during failover
sentinel parallel-syncs beakon-master 1

# Notification scripts (optional)
# sentinel notification-script beakon-master /path/to/notification.sh
# sentinel client-reconfig-script beakon-master /path/to/reconfig.sh

# Logging
dir /tmp
loglevel notice
