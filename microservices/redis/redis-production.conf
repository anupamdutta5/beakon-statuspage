# Redis Production Configuration for Beakon Platform
# High availability, security, and performance tuning

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# General
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Security - IMPORTANT FOR PRODUCTION
# Generate strong password: openssl rand -base64 32
requirepass CHANGE_THIS_TO_STRONG_PASSWORD_MIN_32_CHARS

# Snapshotting (RDB persistence)
save 900 1      # Save after 900 sec if at least 1 key changed
save 300 10     # Save after 300 sec if at least 10 keys changed
save 60 10000   # Save after 60 sec if at least 10000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File (AOF persistence) - PRODUCTION CRITICAL
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management - CRITICAL FOR PRODUCTION
maxmemory 1gb
maxmemory-policy allkeys-lru  # Evict least recently used keys

# Lazy Freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Clients
maxclients 10000

# Performance Tuning
slowlog-log-slower-than 10000
slowlog-max-len 256

# Replication (for master-slave setup)
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
repl-backlog-size 32mb
repl-backlog-ttl 3600
replica-priority 100

# Sentinel compatibility
# Required for high availability with Redis Sentinel
min-replicas-to-write 0
min-replicas-max-lag 10

# Cluster (disabled for sentinel setup)
cluster-enabled no

# Advanced
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# TLS/SSL (Optional - uncomment for encryption in transit)
# port 0
# tls-port 6380
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt
