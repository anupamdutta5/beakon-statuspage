environment: production

service:
  name: tenant-admin-service
  version: 1.0.0
  description: Tenant Admin Service for StatusPage
  tags:
    - tenant-admin
    - microservice
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: localhost
  port: 5432
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database: test_db
  host: localhost
  port: 5432
  user: test_user
  password: ${DB_PASSWORD}
  name: ${DB_NAME}
  ssl_mode: require
  max_conns: 100
  min_conns: 10
  max_idle: 20
  max_lifetime: 3600

cache:
  provider: redis
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 0
  ttl: 300
  key_prefix: "statuspage:tenant-admin-service"

logging:
  level: info
  format: json
  output: stdout

jwt:
  secret: ${JWT_SECRET}
  expiration: 24
  issuer: statuspage-prod

monitoring:
  enabled: true
  metrics_port: 5432
  health_port: 5432
  log_level: info
