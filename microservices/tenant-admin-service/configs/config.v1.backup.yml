# Tenant Admin Service Configuration
# This file contains all non-secret configuration
# Secrets (passwords, tokens) are in .env file

service:
  name: tenant-admin-service
  version: 1.0.0
  environment: ${ENVIRONMENT:-development}

server:
  port: 8099
  host: 0.0.0.0
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  host: ${DB_HOST:-localhost}
  port: 5432
  user: postgres
  password: ${DB_PASSWORD}  # SECRET - from .env
  name: tenant_admin_db
  ssl_mode: ${DB_SSL_MODE:-disable}
  max_conns: 100
  min_conns: 10
  conn_max_lifetime: 3600s  # 1 hour
  conn_max_idle_time: 600s   # 10 minutes

redis:
  enabled: ${REDIS_ENABLED:-true}
  host: ${REDIS_HOST:-localhost}
  port: 6379
  password: ${REDIS_PASSWORD}  # SECRET - from .env
  db: 0
  max_retries: 3
  pool_size: 10
  min_idle_conns: 5

rabbitmq:
  host: ${RABBITMQ_HOST:-localhost}
  port: 5672
  user: ${RABBITMQ_USER:-admin}
  password: ${RABBITMQ_PASSWORD}  # SECRET - from .env
  vhost: /

jwt:
  secret: ${JWT_SECRET}  # SECRET - from .env (min 32 characters)
  expiration: 24h
  issuer: beakon-tenant-admin

cors:
  allowed_origins:
    - ${FRONTEND_URL:-http://localhost:3002}
    - ${SAAS_ADMIN_URL:-http://localhost:3001}
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Tenant-ID
    - X-Correlation-ID
  allow_credentials: true
  max_age: 3600

session:
  cookie_name: tenant_session
  cookie_secure: false  # Set to true in production
  cookie_http_only: true
  cookie_same_site: lax
  session_ttl: 86400    # 24 hours in seconds

monitoring:
  enabled: true
  metrics_port: 9099
  health_path: /health
  metrics_path: /metrics
  log_level: ${LOG_LEVEL:-info}

rate_limiting:
  enabled: true
  requests_per_minute: 100
  burst: 10

security:
  sanitization_enabled: true
  max_string_length: 1000
  strict_mode: false

tenant:
  default_plan: free
  available_plans:
    - free
    - pro
    - enterprise
  max_users_per_tenant: 10
  max_services_per_tenant: 25
  max_monitors_per_tenant: 100
  max_subscribers_per_tenant: 1000
  max_incidents_per_tenant: 100
  max_maintenance_per_tenant: 50
  custom_domain_enabled: true
  white_label_enabled: false
  api_enabled: true
  integrations_enabled: true
  analytics_enabled: true
  support_level: email
  feature_flags_enabled: true
  audit_logging_enabled: true
  backup_enabled: true
  backup_interval: 24
  retention_days: 365
