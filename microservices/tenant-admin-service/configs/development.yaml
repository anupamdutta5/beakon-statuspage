environment: development

service:
  name: tenant-admin-service
  version: 1.0.0
  description: Tenant Admin Service for StatusPage
  tags:
    - tenant-admin
    - microservice
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: ${SERVER_HOST:localhost}
  port: ${SERVER_PORT:8099}
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  user: ${DB_USER:postgres}
  password: ${DB_PASSWORD}
  name: ${DB_NAME:tenant_admin_db}
  ssl_mode: ${DB_SSLMODE:disable}
  max_conns: ${DB_MAX_OPEN_CONNS:25}
  min_conns: ${DB_MAX_IDLE_CONNS:5}
  max_idle: ${DB_MAX_IDLE_CONNS:10}
  max_lifetime: ${DB_CONN_MAX_LIFETIME:3600}

cache:
  provider: redis
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  db: ${REDIS_DB:0}
  ttl: 300
  key_prefix: "statuspage:tenant-admin-service"

logging:
  level: ${LOG_LEVEL:debug}
  format: ${LOG_FORMAT:json}
  output: stdout

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:24}
  issuer: ${JWT_ISSUER:statuspage-dev}

monitoring:
  enabled: true
  metrics_port: ${METRICS_PORT:9099}
  health_port: ${SERVER_PORT:8099}
  log_level: ${LOG_LEVEL:debug}

features:
  use_database_service: ${FEATURE_USE_DATABASE_SERVICE:false}
