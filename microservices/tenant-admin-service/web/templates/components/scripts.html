{{define "scripts"}}
<script>
    // Global variables
    let currentPage = 0;
    let pageSize = 20;
    let totalUsers = 0;
    let tenantId = '{{.tenant_id}}';

    // Custom Alert System
    function showAlert(message, type = 'info') {
        const container = document.getElementById('customAlertContainer');
        const alertId = 'alert-' + Date.now();

        const bgColors = {
            'success': '#10b981',
            'error': '#ef4444',
            'warning': '#f59e0b',
            'info': '#3b82f6'
        };

        const icons = {
            'success': 'fa-check-circle',
            'error': 'fa-exclamation-circle',
            'warning': 'fa-exclamation-triangle',
            'info': 'fa-info-circle'
        };

        const alert = document.createElement('div');
        alert.id = alertId;
        alert.style.cssText = `
            background: ${bgColors[type]};
            color: white;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.3s ease-out;
        `;

        alert.innerHTML = `
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fas ${icons[type]}"></i>
                <span>${message}</span>
            </div>
            <button onclick="this.parentElement.remove()" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 0; margin-left: 12px;">×</button>
        `;

        container.appendChild(alert);

        setTimeout(() => {
            const el = document.getElementById(alertId);
            if (el) {
                el.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => el.remove(), 300);
            }
        }, 5000);
    }

    function showConfirm(message, onConfirm, title = 'Confirm Action') {
        return new Promise((resolve) => {
            const modal = document.getElementById('customConfirmModal');
            const modalInstance = bootstrap.Modal.getOrCreateInstance(modal);

            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;

            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');

            // Remove old event listeners
            const newOkBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);

            newOkBtn.onclick = () => {
                modalInstance.hide();
                if (onConfirm) onConfirm();
                resolve(true);
            };

            modalInstance.show();
            resolve(false);
        });
    }

    // Add CSS animation styles
    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }
    `;
    document.head.appendChild(style);

    // Sidebar Toggle Function
    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        sidebar.classList.toggle('collapsed');

        // Save state to localStorage
        const isCollapsed = sidebar.classList.contains('collapsed');
        localStorage.setItem('sidebarCollapsed', isCollapsed);
    }

    // Restore sidebar state on page load
    document.addEventListener('DOMContentLoaded', () => {
        const sidebarCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        if (sidebarCollapsed) {
            document.querySelector('.sidebar').classList.add('collapsed');
        }
    });

    // Navigation
    function showSection(sectionName) {
        // Hide all sections
        document.querySelectorAll('.content-section').forEach(section => {
            section.style.display = 'none';
        });

        // Show selected section
        const section = document.getElementById(sectionName + '-section');
        if (section) {
            section.style.display = 'block';
        }

        // Update active nav link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.remove('active');
        });
        event.target.closest('.nav-link').classList.add('active');

        // Update page title
        const titles = {
            'dashboard': 'Dashboard',
            'status-pages': 'Status Pages',
            'components': 'Components',
            'incidents': 'Incidents',
            'subscribers': 'Subscribers',
            'users': 'User Management',
            'settings': 'Settings'
        };
        document.getElementById('pageTitle').textContent = titles[sectionName] || 'Dashboard';

        // Load users data when users section is shown
        if (sectionName === 'users') {
            loadUserStats();
            loadUsers();
        }
    }

    // User Management Functions
    async function loadUserStats() {
        try {
            const response = await fetch(`/api/v1/users/${tenantId}/stats`, {
                credentials: 'include'
            });

            if (!response.ok) throw new Error('Failed to load user stats');

            const data = await response.json();
            const stats = data.data;

            document.getElementById('userCount').textContent = stats.current_users || 0;

            if (stats.max_users === null || stats.max_users === 0) {
                document.getElementById('userLimit').textContent = 'Unlimited Users';
                document.getElementById('userCapacityFill').style.width = '0%';
            } else {
                document.getElementById('userLimit').textContent = `${stats.current_users}/${stats.max_users} Users`;
                const percentage = (stats.current_users / stats.max_users) * 100;
                document.getElementById('userCapacityFill').style.width = percentage + '%';

                // Color code the capacity bar
                const fill = document.getElementById('userCapacityFill');
                if (percentage >= 95) {
                    fill.style.background = '#ef4444'; // Red
                } else if (percentage >= 80) {
                    fill.style.background = '#f59e0b'; // Yellow
                } else {
                    fill.style.background = '#667eea'; // Purple
                }
            }
        } catch (error) {
            console.error('Error loading user stats:', error);
        }
    }

    async function loadUsers(offset = 0) {
        try {
            const response = await fetch(`/api/v1/users/${tenantId}?limit=${pageSize}&offset=${offset}`, {
                credentials: 'include'
            });

            if (!response.ok) throw new Error('Failed to load users');

            const data = await response.json();
            totalUsers = data.total;
            currentPage = Math.floor(offset / pageSize);

            const tbody = document.getElementById('usersTableBody');

            if (data.data && data.data.length > 0) {
                tbody.innerHTML = data.data.map(user => `
                    <tr>
                        <td>${user.email}</td>
                        <td>${user.first_name || ''} ${user.last_name || ''}</td>
                        <td><span class="badge bg-info">${user.role || 'user'}</span></td>
                        <td>
                            ${user.is_active
                                ? '<span class="badge bg-success">Active</span>'
                                : '<span class="badge bg-secondary">Inactive</span>'}
                        </td>
                        <td>${new Date(user.created_at).toLocaleDateString()}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="showEditUserModal(${user.id}, '${user.email}', '${user.first_name || ''}', '${user.last_name || ''}', ${user.is_active}, '${user.role || 'admin'}')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUserConfirm(${user.id}, '${user.email}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                // Update pagination
                document.getElementById('usersInfo').textContent =
                    `Showing ${offset + 1}-${Math.min(offset + data.data.length, totalUsers)} of ${totalUsers} users`;
                document.getElementById('prevPageBtn').disabled = offset === 0;
                document.getElementById('nextPageBtn').disabled = offset + pageSize >= totalUsers;
                document.getElementById('usersPagination').style.display = 'flex';
            } else {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">No users found</td></tr>';
                document.getElementById('usersPagination').style.display = 'none';
            }
        } catch (error) {
            console.error('Error loading users:', error);
            document.getElementById('usersTableBody').innerHTML =
                '<tr><td colspan="6" class="text-center text-danger">Error loading users</td></tr>';
        }
    }

    function loadNextPage() {
        loadUsers((currentPage + 1) * pageSize);
    }

    function loadPreviousPage() {
        loadUsers((currentPage - 1) * pageSize);
    }

    function showCreateUserModal() {
        document.getElementById('createUserForm').reset();
        const modalElement = document.getElementById('createUserModal');

        // Try using Bootstrap Modal if available
        if (typeof bootstrap !== 'undefined') {
            const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
            modal.show();
        } else {
            // Fallback: manually show modal
            modalElement.classList.add('show');
            modalElement.style.display = 'block';
            modalElement.setAttribute('aria-modal', 'true');
            modalElement.setAttribute('role', 'dialog');
            modalElement.removeAttribute('aria-hidden');

            // Add backdrop
            const backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop fade show';
            backdrop.id = 'createUserModalBackdrop';
            document.body.appendChild(backdrop);
            document.body.classList.add('modal-open');
        }
    }

    function hideCreateUserModal() {
        const modalElement = document.getElementById('createUserModal');

        // Try using Bootstrap Modal if available
        if (typeof bootstrap !== 'undefined') {
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) {
                modal.hide();
            }
        } else {
            // Fallback: manually hide modal
            modalElement.classList.remove('show');
            modalElement.style.display = 'none';
            modalElement.setAttribute('aria-hidden', 'true');
            modalElement.removeAttribute('aria-modal');
            modalElement.removeAttribute('role');

            // Remove backdrop
            const backdrop = document.getElementById('createUserModalBackdrop');
            if (backdrop) {
                backdrop.remove();
            }
            document.body.classList.remove('modal-open');
        }
    }

    async function createUser() {
        const email = document.getElementById('userEmail').value.trim();
        const password = document.getElementById('userPassword').value;
        const firstName = document.getElementById('userFirstName').value.trim();
        const lastName = document.getElementById('userLastName').value.trim();
        const role = document.getElementById('userRole').value;

        if (!email || !password) {
            showAlert('Email and password are required', 'error');
            return;
        }

        if (password.length < 8) {
            showAlert('Password must be at least 8 characters', 'error');
            return;
        }

        try {
            const response = await fetch(`/api/v1/users/${tenantId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    email,
                    password,
                    first_name: firstName,
                    last_name: lastName,
                    role
                })
            });

            const data = await response.json();

            if (!response.ok) {
                if (data.code === 'MAX_USERS_EXCEEDED') {
                    showAlert('Cannot create user: ' + data.error, 'error');
                } else {
                    showAlert(data.error || 'Failed to create user', 'error');
                }
                return;
            }

            // Close modal and reload users
            const modalElement = document.getElementById('createUserModal');
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) {
                modal.hide();
            }
            loadUserStats();
            loadUsers(currentPage * pageSize);
            showAlert('User created successfully!', 'success');
        } catch (error) {
            console.error('Error creating user:', error);
            showAlert('Failed to create user', 'error');
        }
    }

    async function showEditUserModal(userId, email, firstName, lastName, isActive, role) {
        // Blur the triggering button to prevent focus issues
        if (document.activeElement) {
            document.activeElement.blur();
        }

        // Set form values
        document.getElementById('editUserId').value = userId;
        document.getElementById('editUserEmail').value = email;
        document.getElementById('editUserFirstName').value = firstName;
        document.getElementById('editUserLastName').value = lastName;
        document.getElementById('editUserActive').checked = isActive;
        document.getElementById('editUserRole').value = role || 'admin';

        // Reset role field and warning
        const roleSelect = document.getElementById('editUserRole');
        const roleWarning = document.getElementById('editRoleWarning');
        roleSelect.disabled = false;
        roleWarning.style.display = 'none';

        // Check if this user is the last admin
        if (role === 'admin') {
            try {
                const response = await fetch(`/api/v1/users/${tenantId}?limit=1000&offset=0`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    const activeAdmins = data.data.filter(u => u.role === 'admin' && u.is_active);

                    if (activeAdmins.length <= 1) {
                        roleSelect.disabled = true;
                        roleWarning.style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error checking admin count:', error);
            }
        }

        const modalElement = document.getElementById('editUserModal');

        // Try using Bootstrap Modal if available
        if (typeof bootstrap !== 'undefined') {
            const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
            modal.show();
        } else {
            // Fallback: manually show modal
            modalElement.classList.add('show');
            modalElement.style.display = 'block';
            modalElement.setAttribute('aria-modal', 'true');
            modalElement.setAttribute('role', 'dialog');
            modalElement.removeAttribute('aria-hidden');

            // Add backdrop
            const backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop fade show';
            backdrop.id = 'editUserModalBackdrop';
            backdrop.onclick = hideEditUserModal;
            document.body.appendChild(backdrop);
            document.body.classList.add('modal-open');
        }
    }

    function hideEditUserModal() {
        const modalElement = document.getElementById('editUserModal');

        // Try using Bootstrap Modal if available
        if (typeof bootstrap !== 'undefined') {
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) {
                modal.hide();
            }
        } else {
            // Fallback: manually hide modal
            modalElement.classList.remove('show');
            modalElement.style.display = 'none';
            modalElement.setAttribute('aria-hidden', 'true');
            modalElement.removeAttribute('aria-modal');
            modalElement.removeAttribute('role');

            // Remove backdrop
            const backdrop = document.getElementById('editUserModalBackdrop');
            if (backdrop) {
                backdrop.remove();
            }
            document.body.classList.remove('modal-open');
        }
    }

    async function updateUser() {
        const userId = document.getElementById('editUserId').value;
        const firstName = document.getElementById('editUserFirstName').value.trim();
        const lastName = document.getElementById('editUserLastName').value.trim();
        const isActive = document.getElementById('editUserActive').checked;
        const role = document.getElementById('editUserRole').value;

        try {
            const response = await fetch(`/api/v1/users/${tenantId}/${userId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    first_name: firstName,
                    last_name: lastName,
                    is_active: isActive,
                    role: role
                })
            });

            const data = await response.json();

            if (!response.ok) {
                showAlert(data.error || 'Failed to update user', 'error');
                return;
            }

            // Close modal and reload users
            const modalElement = document.getElementById('editUserModal');
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) {
                modal.hide();
            }
            loadUsers(currentPage * pageSize);
            showAlert('User updated successfully!', 'success');
        } catch (error) {
            console.error('Error updating user:', error);
            showAlert('Failed to update user', 'error');
        }
    }

    async function deleteUserConfirm(userId, email) {
        showConfirm(
            `Are you sure you want to delete user: ${email}?`,
            async () => {
                try {
                    const response = await fetch(`/api/v1/users/${tenantId}/${userId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        showAlert(data.error || 'Failed to delete user', 'error');
                        return;
                    }

                    loadUserStats();
                    loadUsers(currentPage * pageSize);
                    showAlert('User deleted successfully!', 'success');
                } catch (error) {
                    console.error('Error deleting user:', error);
                    showAlert('Failed to delete user', 'error');
                }
            },
            'Delete User'
        );
    }

    // Logout function
    function logout() {
        showConfirm(
            'Are you sure you want to logout?',
            async () => {
                try {
                    // Call the logout API endpoint
                    const response = await fetch('/api/v1/auth/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });

                    // Clear client-side auth data
                    localStorage.removeItem('auth_token');
                    document.cookie = 'auth_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';

                    // Redirect to login page
                    window.location.href = '/login';
                } catch (error) {
                    console.error('Logout error:', error);
                    // Even if the API call fails, clear client-side data and redirect
                    localStorage.removeItem('auth_token');
                    document.cookie = 'auth_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
                    window.location.href = '/login';
                }
            },
            'Confirm Logout'
        );
    }

    // Fix for Bootstrap 5 aria-hidden accessibility warning
    // Use the inert attribute to properly handle focus during modal transitions
    window.addEventListener('hide.bs.modal', event => {
        event.target.inert = true;
    });

    window.addEventListener('show.bs.modal', event => {
        event.target.inert = false;
    });

    window.addEventListener('hidden.bs.modal', event => {
        event.target.inert = false;
    });
</script>
{{end}}
