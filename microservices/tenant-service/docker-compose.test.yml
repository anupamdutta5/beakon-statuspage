version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=statuspage_tenant_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tenant Service
  tenant-service:
    build:
      context: .
      dockerfile: Dockerfile.test
    ports:
      - "8082:8082"
    environment:
      - ENVIRONMENT=testing
      - SERVER_PORT=8082
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=statuspage_tenant_test
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test-network
    volumes:
      - ./tests:/app/tests
      - ./coverage:/app/coverage
    command: ["go", "test", "-v", "./tests/...", "-coverprofile=coverage/coverage.out"]

  # Test Runner
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - ENVIRONMENT=testing
      - SERVER_PORT=8082
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=statuspage_tenant_test
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      tenant-service:
        condition: service_started
    networks:
      - test-network
    volumes:
      - ./tests:/app/tests
      - ./coverage:/app/coverage
    command: ["go", "test", "-v", "./tests/...", "-coverprofile=coverage/coverage.out", "-covermode=atomic"]

volumes:
  postgres_data:
  redis_data:

networks:
  test-network:
    driver: bridge

