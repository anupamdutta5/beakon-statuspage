openapi: 3.0.3
info:
  title: Tenant Service API
  description: API contract for the Tenant Service
  version: 1.0.0
  contact:
    name: Tenant Service Team
    email: tenant-service@statuspage.com

servers:
  - url: http://localhost:8002
    description: Development server
  - url: https://tenant-service.statuspage.com
    description: Production server

paths:
  /tenants:
    get:
      summary: List tenants
      description: Get a list of tenants with optional filtering
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, suspended]
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create tenant
      description: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tenants/{tenant_id}:
    get:
      summary: Get tenant
      description: Get a specific tenant by ID
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update tenant
      description: Update an existing tenant
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete tenant
      description: Delete a tenant
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tenant deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tenants/{tenant_id}/settings:
    get:
      summary: Get tenant settings
      description: Get tenant-specific settings
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update tenant settings
      description: Update tenant-specific settings
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantSettingsRequest'
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Tenant:
      type: object
      required:
        - id
        - name
        - subdomain
        - status
        - created_at
      properties:
        id:
          type: string
          description: Unique tenant identifier
        name:
          type: string
          description: Tenant name
        subdomain:
          type: string
          description: Tenant subdomain
        domain:
          type: string
          description: Custom domain (optional)
        status:
          type: string
          enum: [active, inactive, suspended]
          description: Tenant status
        plan:
          type: string
          enum: [free, basic, pro, enterprise]
          description: Subscription plan
        settings:
          $ref: '#/components/schemas/TenantSettings'
        created_at:
          type: string
          format: date-time
          description: Tenant creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Tenant last update timestamp

    TenantSettings:
      type: object
      properties:
        branding:
          type: object
          properties:
            logo_url:
              type: string
            primary_color:
              type: string
            secondary_color:
              type: string
        notifications:
          type: object
          properties:
            email_enabled:
              type: boolean
            sms_enabled:
              type: boolean
            webhook_url:
              type: string
        features:
          type: object
          properties:
            custom_domain:
              type: boolean
            sso:
              type: boolean
            api_access:
              type: boolean
        limits:
          type: object
          properties:
            max_users:
              type: integer
            max_components:
              type: integer
            max_incidents:
              type: integer

    CreateTenantRequest:
      type: object
      required:
        - name
        - subdomain
      properties:
        name:
          type: string
        subdomain:
          type: string
        domain:
          type: string
        plan:
          type: string
          enum: [free, basic, pro, enterprise]
          default: free

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        plan:
          type: string
          enum: [free, basic, pro, enterprise]

    UpdateTenantSettingsRequest:
      type: object
      properties:
        branding:
          type: object
          properties:
            logo_url:
              type: string
            primary_color:
              type: string
            secondary_color:
              type: string
        notifications:
          type: object
          properties:
            email_enabled:
              type: boolean
            sms_enabled:
              type: boolean
            webhook_url:
              type: string
        features:
          type: object
          properties:
            custom_domain:
              type: boolean
            sso:
              type: boolean
            api_access:
              type: boolean

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details

