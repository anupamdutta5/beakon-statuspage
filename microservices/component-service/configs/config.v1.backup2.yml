service:
  name: component-service
  version: 1.0.0
  environment: ${ENVIRONMENT:-development}

server:
  port: 8084
  host: 0.0.0.0
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  host: ${DB_HOST:-localhost}
  port: 5432
  user: postgres
  password: ${DB_PASSWORD}
  name: components
  ssl_mode: ${DB_SSL_MODE:-disable}
  max_conns: 100
  min_conns: 10
  conn_max_lifetime: 3600s
  conn_max_idle_time: 600s

jwt:
  secret: ${JWT_SECRET}
  expiration: 24h
  issuer: beakon-component-service

monitoring:
  enabled: true
  metrics_port: 9084
  health_path: /health
  metrics_path: /metrics
  log_level: ${LOG_LEVEL:-info}

rate_limiting:
  enabled: true
  requests_per_minute: 100
  burst: 10

security:
  sanitization_enabled: true
  max_string_length: 1000
  strict_mode: false
