environment: production

service:
  name: status-page-ui-service
  version: 1.0.0
  description: Status Page UI Service for StatusPage
  tags:
    - status-page
    - ui
    - frontend
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: localhost
  port: 8095
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

cache:
  provider: redis
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 0
  ttl: 300
  key_prefix: "statuspage:status-page-ui-service"

logging:
  level: info
  format: json
  output: stdout

templates:
  path: web/templates
  cache: true

static:
  path: web/static
  cache_control: "public, max-age=86400"

services:
  incident_service:
    base_url: ${INCIDENT_SERVICE_URL}
    timeout: 5s
  component_service:
    base_url: ${COMPONENT_SERVICE_URL}
    timeout: 5s
  monitoring_service:
    base_url: ${MONITORING_SERVICE_URL}
    timeout: 5s
  tenant_service:
    base_url: ${TENANT_SERVICE_URL}
    timeout: 5s

features:
  enable_real_time_updates: true
  enable_subscriber_management: true
  enable_maintenance_mode: true
  enable_incident_history: true




