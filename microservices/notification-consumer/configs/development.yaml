environment: development

consumer:
  name: notification-consumer
  version: 1.0.0
  description: Notification Consumer for StatusPage
  tags:
    - notification
    - consumer
    - event-driven
  metadata:
    owner: platform-team
    maintainer: devops@company.com

kafka:
  brokers:
    - localhost:9092
  group_id: notification-consumer-dev
  auto_offset_reset: earliest
  enable_auto_commit: true

database: test_db
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  user: ${DB_USER:statuspage_user}
  password: ${DB_PASSWORD}
  name: ${DB_NAME:statuspage_notification_consumer
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_idle: 10
  max_lifetime: 3600

cache:
  provider: redis
  host: ${DB_HOST:localhost}
  port: 6379
  password: ""
  db: 0
  ttl: 300
  key_prefix: "statuspage:notification-consumer"

logging:
  level: ${LOG_LEVEL:debug}
  format: json
  output: stdout

processing:
  batch_size: 100
  max_retries: 3
  retry_delay: 5s
  timeout: 30s

notifications:
  email:
    provider: smtp
    smtp_host: ${DB_HOST:localhost}
    smtp_port: ${DB_PORT:5432}
    from_email: noreply@statuspage.dev
  sms:
    provider: twilio
    account_sid: test-account-sid
    auth_token: test-auth-token
    from_number: "+1234567890"
  slack:
    webhook_url: https://hooks.slack.com/services/test/webhook/url
