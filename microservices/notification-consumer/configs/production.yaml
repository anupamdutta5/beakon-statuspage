environment: production

consumer:
  name: notification-consumer
  version: 1.0.0
  description: Notification Consumer for StatusPage
  tags:
    - notification
    - consumer
    - event-driven
  metadata:
    owner: platform-team
    maintainer: devops@company.com

kafka:
  brokers:
    - ${KAFKA_BROKERS}
  group_id: notification-consumer-prod
  auto_offset_reset: latest
  enable_auto_commit: true

database: test_db
  host: localhost
  port: 5432
  user: test_user
  password: test_password
  name: ${DB_NAME}
  ssl_mode: require
  max_conns: 100
  min_conns: 10
  max_idle: 20
  max_lifetime: 3600

cache:
  provider: redis
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  db: 0
  ttl: 300
  key_prefix: "statuspage:notification-consumer"

logging:
  level: info
  format: json
  output: stdout

processing:
  batch_size: 1000
  max_retries: 5
  retry_delay: 10s
  timeout: 60s

notifications:
  email:
    provider: sendgrid
    api_key: ${SENDGRID_API_KEY}
    from_email: ${SENDGRID_FROM_EMAIL}
  sms:
    provider: twilio
    account_sid: ${TWILIO_ACCOUNT_SID}
    auth_token: ${TWILIO_AUTH_TOKEN}
    from_number: ${TWILIO_FROM_NUMBER}
  slack:
    webhook_url: ${SLACK_WEBHOOK_URL}

