<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad'$i'" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl('$((i*60))', 70%, 60%)" />
      <stop offset="100%" style="stop-color:hsl('$((i*60+30))', 70%, 50%)" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#grad'$i')"/>
  <circle cx="50" cy="40" r="15" fill="white" opacity="0.9"/>
  <circle cx="50" cy="70" r="25" fill="white" opacity="0.9"/>
</svg>
