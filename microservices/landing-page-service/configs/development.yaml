environment: development

service:
  name: landing-page-service
  version: 1.0.0
  description: Landing Page Service for StatusPage
  tags:
    - landing
    - marketing
    - frontend
  metadata:
    owner: platform-team
    maintainer: devops@company.com

server:
  host: 0.0.0.0
  port: 8100
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120

database:
  host: localhost
  port: 5432
  user: postgres
  password: password
  name: statuspage_landing
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_idle: 10
  max_lifetime: 3600

cache:
  provider: redis
  host: localhost
  port: 6379
  password: ""
  db: 0
  ttl: 300

logging:
  level: debug
  format: json
  output: stdout

templates:
  path: web/templates
  cache: false

static:
  path: web/static
  cache_control: "public, max-age=3600"

services:
  database_service:
    base_url: http://localhost:8090
    timeout: 5s
  event_store_service:
    base_url: http://localhost:8091
    timeout: 5s
  saas_admin_service:
    base_url: http://localhost:8092
    timeout: 5s

features:
  enable_analytics: true
  enable_contact_form: true
  enable_newsletter: true
  enable_blog: true
