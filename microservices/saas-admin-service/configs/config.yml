# SaaS Admin Service Configuration
# This file contains all non-secret configuration
# Secrets (passwords, tokens) are in .env file

service:
  name: saas-admin-service
  version: 1.0.0
  environment: ${ENVIRONMENT:-development}

server:
  port: 8098
  host: 0.0.0.0
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

database:
  host: ${DB_HOST:-localhost}
  port: 5432
  user: postgres
  password: ${DB_PASSWORD}  # SECRET - from .env
  name: saas_admin
  ssl_mode: ${DB_SSL_MODE:-disable}
  max_conns: 100
  min_conns: 10
  conn_max_lifetime: 3600s  # 1 hour
  conn_max_idle_time: 600s   # 10 minutes

rabbitmq:
  host: ${RABBITMQ_HOST:-localhost}
  port: 5672
  user: ${RABBITMQ_USER:-admin}
  password: ${RABBITMQ_PASSWORD}  # SECRET - from .env
  vhost: /

jwt:
  secret: ${JWT_SECRET}  # SECRET - from .env (min 32 characters)
  expiration: 24h
  issuer: beakon-saas-admin

cors:
  allowed_origins:
    - ${FRONTEND_URL:-http://localhost:3001}
    - ${TENANT_ADMIN_URL:-http://localhost:3002}
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - PATCH
  allowed_headers:
    - Content-Type
    - Authorization
    - X-Correlation-ID
  allow_credentials: true
  max_age: 3600

monitoring:
  enabled: true
  metrics_port: 9098
  health_path: /health
  metrics_path: /metrics
  log_level: ${LOG_LEVEL:-info}

rate_limiting:
  enabled: true
  requests_per_minute: 100
  burst: 10

security:
  sanitization_enabled: true
  max_string_length: 1000
  strict_mode: false
