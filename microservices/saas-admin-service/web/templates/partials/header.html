{{define "partials/header.html"}}
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">Enterprise Dashboard</h1>
            <div class="header-actions">
                <button class="btn-modern btn-outline-modern" id="refreshData">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                </button>
                <div class="dropdown">
                    <button class="btn-modern btn-primary-modern dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-plus"></i>
                        Quick Actions
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" onclick="createTenant()">
                            <i class="fas fa-building text-primary"></i> Create Tenant
                        </a></li>
                        <li><a class="dropdown-item" href="#tenants" onclick="showTab('tenants')">
                            <i class="fas fa-users-cog text-info"></i> Manage Tenants
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="addPlan()">
                            <i class="fas fa-layer-group text-success"></i> Add Plan
                        </a></li>
                        <li><a class="dropdown-item" href="#" onclick="platformSettings()">
                            <i class="fas fa-cogs text-warning"></i> Platform Settings
                        </a></li>
                    </ul>
                </div>
                <button class="btn-modern btn-outline-modern" onclick="logout()" style="margin-left: 10px;">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </header>
{{end}}
