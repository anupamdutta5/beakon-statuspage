environment: development

consumer:
  name: audit-consumer
  version: 1.0.0
  description: Audit Consumer for StatusPage
  tags:
    - audit
    - consumer
    - event-driven
  metadata:
    owner: platform-team
    maintainer: devops@company.com

kafka:
  brokers:
    - localhost: localhost
  group_id: audit-consumer-dev
  auto_offset_reset: earliest
  enable_auto_commit: true

database: test_db
  host: localhost
  port: 5432
  user: test_user
  password: test_password
  name: statuspage_audit_consumer
  ssl_mode: disable
  max_conns: 25
  min_conns: 5
  max_idle: 10
  max_lifetime: 3600

cache:
  provider: redis
  host: localhost
  port: 5432
  password: test_password
  db: 0
  ttl: 300

logging:
  level: debug
  format: json
  output: stdout

processing:
  batch_size: 100
  max_retries: 3
  retry_delay: 5s
  timeout: 30s
