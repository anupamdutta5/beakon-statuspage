services:
  # === CORE SERVICES ===

  # User Service (Port 8080)
  user-service:
    build:
      context: .
      dockerfile: microservices/user-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_users
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - statuspage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./shared-resilience:/app/shared-resilience

  # API Gateway (Port 8081)
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile_inline: |
        FROM golang:1.23-alpine AS builder
        WORKDIR /app
        ENV GOTOOLCHAIN=auto
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8081
        CMD ["./main"]
    ports:
      - "8081:8081"
    environment:
      - ENVIRONMENT=development
      - PORT=8081
      - USER_SERVICE_URL=http://user-service:8080
      - COMPONENT_SERVICE_URL=http://component-service:8082
      - ANALYTICS_SERVICE_URL=http://analytics-service:8083
      - INCIDENT_SERVICE_URL=http://incident-service:8084
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - PAYMENT_SERVICE_URL=http://payment-service:8087
    depends_on:
      - user-service
    networks:
      - statuspage-network
    restart: unless-stopped

