    depends_on:
      - postgres
      - kafka
    networks:
      - statuspage-network
    restart: unless-stopped

  # Audit Consumer (Port 8098)
  audit-consumer:
    build:
      context: ./microservices/audit-consumer
      dockerfile_inline: |
        FROM golang:1.23-alpine AS builder
        WORKDIR /app
        ENV GOTOOLCHAIN=auto
        COPY go.mod go.sum ./
