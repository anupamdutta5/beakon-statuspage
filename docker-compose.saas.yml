version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: statuspage_user
      POSTGRES_PASSWORD: statuspage_password
      POSTGRES_DB: statuspage_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statuspage_user -d statuspage_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SaaS Admin Service
  saas-admin-service:
    build:
      context: .
      dockerfile: microservices/saas-admin-service/Dockerfile
    working_dir: /app/microservices/saas-admin-service
    ports:
      - "8089:8080"
    environment:
      - ENVIRONMENT=development
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_saas
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
