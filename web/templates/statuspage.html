<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status - StatusPage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/statuspage.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="statuspage-container">
        <!-- Header -->
        <header class="statuspage-header">
            <div class="header-content">
                <div class="logo-section">
                    <h1 class="site-title">System Status</h1>
                    <div class="overall-status-badge" id="overall-status">
                        <span class="status-indicator operational"></span>
                        <span class="status-text">All Systems Operational</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="subscribe-btn" id="subscribe-btn">Subscribe to Updates</button>
                    <a href="/admin/dashboard" class="admin-link">Admin</a>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="statuspage-nav">
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="status">Status</button>
                <button class="nav-tab" data-tab="incidents">Incidents</button>
                <button class="nav-tab" data-tab="maintenance">Maintenance</button>
                <button class="nav-tab" data-tab="monitoring">Monitoring</button>
                <button class="nav-tab" data-tab="history">History</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="statuspage-content">
            <!-- Status Tab -->
            <div class="tab-content active" id="status-tab">
                <div class="status-overview">
                    <div class="status-summary">
                        <div class="summary-card">
                            <div class="card-header">
                                <h3>System Status</h3>
                                <span class="status-badge operational">Operational</span>
                            </div>
                            <div class="card-content">
                                <div class="uptime-stats">
                                    <div class="stat">
                                        <span class="stat-value" id="overall-uptime">99.9%</span>
                                        <span class="stat-label">Uptime (30 days)</span>
                                    </div>
                                    <div class="stat">
                                        <span class="stat-value" id="response-time">45ms</span>
                                        <span class="stat-label">Avg Response Time</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="services-grid">
                        <h3>Services</h3>
                        <div class="services-list" id="services-list">
                            <!-- Services will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Incidents Tab -->
            <div class="tab-content" id="incidents-tab">
                <div class="incidents-section">
                    <div class="section-header">
                        <h2>Incidents</h2>
                        <div class="incident-filters">
                            <select id="incident-status-filter">
                                <option value="all">All Statuses</option>
                                <option value="investigating">Investigating</option>
                                <option value="identified">Identified</option>
                                <option value="monitoring">Monitoring</option>
                                <option value="resolved">Resolved</option>
                            </select>
                        </div>
                    </div>
                    <div class="incidents-list" id="incidents-list">
                        <!-- Incidents will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Maintenance Tab -->
            <div class="tab-content" id="maintenance-tab">
                <div class="maintenance-section">
                    <div class="section-header">
                        <h2>Scheduled Maintenance</h2>
                    </div>
                    <div class="maintenance-list" id="maintenance-list">
                        <!-- Maintenance windows will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Monitoring Tab -->
            <div class="tab-content" id="monitoring-tab">
                <div class="monitoring-section">
                    <div class="section-header">
                        <h2>System Monitoring</h2>
                        <div class="monitoring-filters">
                            <select id="monitoring-timeframe">
                                <option value="24h">Last 24 hours</option>
                                <option value="7d">Last 7 days</option>
                                <option value="30d">Last 30 days</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="monitoring-grid">
                        <div class="monitoring-card">
                            <h3>Uptime Overview</h3>
                            <div class="chart-container">
                                <canvas id="uptime-chart"></canvas>
                            </div>
                        </div>
                        
                        <div class="monitoring-card">
                            <h3>Response Time</h3>
                            <div class="chart-container">
                                <canvas id="response-time-chart"></canvas>
                            </div>
                        </div>
                        
                        <div class="monitoring-card">
                            <h3>Error Rate</h3>
                            <div class="chart-container">
                                <canvas id="error-rate-chart"></canvas>
                            </div>
                        </div>
                        
                        <div class="monitoring-card">
                            <h3>Service Health</h3>
                            <div class="health-metrics" id="health-metrics">
                                <!-- Health metrics will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- History Tab -->
            <div class="tab-content" id="history-tab">
                <div class="history-section">
                    <div class="section-header">
                        <h2>Status History</h2>
                        <div class="history-filters">
                            <select id="history-timeframe">
                                <option value="7d">Last 7 days</option>
                                <option value="30d">Last 30 days</option>
                                <option value="90d">Last 90 days</option>
                            </select>
                        </div>
                    </div>
                    <div class="history-timeline" id="history-timeline">
                        <!-- Status history will be loaded here -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Subscribe Modal -->
        <div class="modal" id="subscribe-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Subscribe to Updates</h2>
                    <span class="close-btn" id="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="subscribe-form">
                        <div class="form-group">
                            <label for="subscriber-email">Email Address</label>
                            <input type="email" id="subscriber-email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Services to Monitor</label>
                            <div class="services-checkboxes" id="services-checkboxes">
                                <!-- Service checkboxes will be loaded here -->
                            </div>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="sms-notifications" name="sms">
                                Also send SMS notifications
                            </label>
                        </div>
                        <div class="form-group" id="phone-group" style="display: none;">
                            <label for="subscriber-phone">Phone Number</label>
                            <input type="tel" id="subscriber-phone" name="phone">
                        </div>
                        <button type="submit" class="subscribe-submit-btn">Subscribe</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/statuspage.js"></script>
</body>
</html>
