<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ .Title }}</h1>
        <form action="{{ .Action }}" method="post">
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ .Maintenance.Title }}" required>
            </div>
            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description" required>{{ .Maintenance.Description }}</textarea>
            </div>
            <div>
                <label for="start_at">Start At</label>
                <input type="datetime-local" id="start_at" name="start_at" value="{{ if .Maintenance }}{{ .Maintenance.StartAt.Format "2006-01-02T15:04" }}{{ end }}" required>
            </div>
            <div>
                <label for="end_at">End At</label>
                <input type="datetime-local" id="end_at" name="end_at" value="{{ .Maintenance.EndAt.Format "2006-01-02T15:04" }}" required>
            </div>
            <button type="submit">Save</button>
        </form>
        <p><a href="/admin/dashboard">Back to Dashboard</a></p>
    </div>
</body>
</html>
