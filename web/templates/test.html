<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
</head>
<body>
    <h1>Test Page</h1>
    <div id="test-content">Loading...</div>
    
    <script src="/static/admin.js"></script>
    <script>
        console.log('Test page loaded');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, testing AdminDashboard...');
            try {
                window.adminDashboard = new AdminDashboard();
                console.log('AdminDashboard created successfully');
                
                // Test API call
                fetch('/api/v1/admin/services', { credentials: 'include' })
                    .then(response => {
                        console.log('API response status:', response.status);
                        return response.json();
                    })
                    .then(data => {
                        console.log('API data:', data);
                        document.getElementById('test-content').innerHTML = `
                            <h2>API Test Results:</h2>
                            <p>Status: Success</p>
                            <p>Services count: ${data.services ? data.services.length : 0}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                    })
                    .catch(error => {
                        console.error('API error:', error);
                        document.getElementById('test-content').innerHTML = `
                            <h2>API Test Results:</h2>
                            <p>Status: Error</p>
                            <p>Error: ${error.message}</p>
                        `;
                    });
            } catch (error) {
                console.error('Error creating AdminDashboard:', error);
                document.getElementById('test-content').innerHTML = `
                    <h2>Error:</h2>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
