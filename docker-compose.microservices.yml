        EXPOSE 8090
        CMD ["./main"]
    ports:
      - "8090:8090"
    environment:
      - ENVIRONMENT=development
      - PORT=8090
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
    networks:
      - statuspage-network
    restart: unless-stopped

  # Monitoring Service (Port 8091)
  monitoring-service:
    build:
      context: ./microservices/monitoring-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8091
        CMD ["./main"]
    ports:
      - "8091:8091"
    environment:
      - ENVIRONMENT=development
      - PORT=8091
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
    networks:
      - statuspage-network
    restart: unless-stopped

  # Event Store Service (Port 8093)
  event-store-service:
    build:
      context: ./microservices/event-store-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8093
        CMD ["./main"]
    ports:
      - "8093:8093"
    environment:
      - ENVIRONMENT=development
      - PORT=8093
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
    networks:
      - statuspage-network
    restart: unless-stopped

  # === UI SERVICES ===

  # Branding Service (Port 8092)
  branding-service:
    build:
      context: ./microservices/branding-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8092
        CMD ["./main"]
    ports:
      - "8092:8092"
    environment:
      - ENVIRONMENT=development
      - PORT=8092
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
    networks:
      - statuspage-network
    restart: unless-stopped

  # Status UI Service (Port 8094)
  status-ui-service:
    build:
      context: ./microservices/status-ui-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8094
        CMD ["./main"]
    ports:
      - "8094:8094"
    environment:
      - ENVIRONMENT=development
      - PORT=8094
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
    networks:
      - statuspage-network
    restart: unless-stopped

  # Database Service (Port 8095)
  database-service:
    build:
      context: ./microservices/database-service
      dockerfile: Dockerfile
    ports:
      - "8095:8095"
    environment:
      - ENVIRONMENT=development
      - PORT=8095
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=statuspage_management
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - statuspage-network
    restart: unless-stopped

  # Landing Page Service (Port 8096)
  landing-page-service:
    build:
      context: ./microservices/landing-page-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8096
        CMD ["./main"]
    ports:
      - "8096:8096"
    environment:
      - ENVIRONMENT=development
      - PORT=8096
    networks:
      - statuspage-network
    restart: unless-stopped

  # === CONSUMER SERVICES ===

  # Analytics Consumer (Port 8097)
  analytics-consumer:
    build:
      context: ./microservices/analytics-consumer
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8097
        CMD ["./main"]
    ports:
      - "8097:8097"
    environment:
      - ENVIRONMENT=development
      - PORT=8097
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
      - kafka
    networks:
      - statuspage-network
    restart: unless-stopped

  # Audit Consumer (Port 8098)
  audit-consumer:
    build:
      context: ./microservices/audit-consumer
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8098
        CMD ["./main"]
    ports:
      - "8098:8098"
    environment:
      - ENVIRONMENT=development
      - PORT=8098
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
      - kafka
    networks:
      - statuspage-network
    restart: unless-stopped

  # Notification Consumer (Port 8099)
  notification-consumer:
    build:
      context: ./microservices/notification-consumer
      dockerfile: Dockerfile
    ports:
      - "8099:8099"
    environment:
      - ENVIRONMENT=development
      - PORT=8099
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
      - kafka
    networks:
      - statuspage-network
    restart: unless-stopped

  # Billing Consumer (Port 8100)
  billing-consumer:
    build:
      context: ./microservices/billing-consumer
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8100
        CMD ["./main"]
    ports:
      - "8100:8100"
    environment:
      - ENVIRONMENT=development
      - PORT=8100
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
      - kafka
    networks:
      - statuspage-network
    restart: unless-stopped

  # === INFRASTRUCTURE ===

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=statuspage_user
      - POSTGRES_PASSWORD=statuspage_password
      - POSTGRES_DB=statuspage_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./microservices/database-service/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statuspage_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - statuspage-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - statuspage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafka for Event Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - statuspage-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - statuspage-network
    restart: unless-stopped

  # InfluxDB for Time Series Data
  influxdb:
    image: influxdb:2.7
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=statuspage
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - statuspage-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  influxdb_data:

networks:
  statuspage-network:
    driver: bridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./microservices/database-service/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statuspage_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - statuspage-network

  # Database Management Service
  database-service:
    build:
      context: ./microservices/database-service
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      - ENVIRONMENT=development
      - SERVER_PORT=8089
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=statuspage_management
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - statuspage-network
    restart: unless-stopped

  # Consul for Service Discovery
  consul:
    image: consul:1.16
    command: consul agent -server -bootstrap-expect=1 -ui -bind=0.0.0.0 -client=0.0.0.0
    ports:
      - "8500:8500"
    volumes:
      - consul_data:/consul/data
    networks:
      - statuspage-network
    restart: unless-stopped

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.49
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - statuspage-network
    restart: unless-stopped

  # InfluxDB for Time Series Data
  influxdb:
    image: influxdb:2.7
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=statuspage
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - statuspage-network
    restart: unless-stopped

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - statuspage-network
    restart: unless-stopped

  # Grafana for Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - statuspage-network
    restart: unless-stopped

  # Kafka for Event Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - statuspage-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - statuspage-network
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - statuspage-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  consul_data:
  influxdb_data:
  prometheus_data:
  grafana_data:

networks:
  statuspage-network:
    driver: bridge