        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8083
        CMD ["./main"]
    ports:
      - "8083:8083"
    environment:
      - ENVIRONMENT=development
      - PORT=8083
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_analytics
    depends_on:
      - postgres
    networks:
      - statuspage-network
    restart: unless-stopped

  # Incident Service (Port 8084)
  incident-service:
    build:
      context: ./microservices/incident-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
