version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - GATEWAY_PORT=8080
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_users
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=statuspage:user-service
      - JWT_SECRET=your_jwt_secret_here
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - postgres
      - redis
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Tenant Admin Service (consolidated tenant management)
  tenant-admin-service:
    build:
      context: .
      dockerfile: Dockerfile.tenant-admin-service
    ports:
      - "8080:8080"  # Expose for external access
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_tenants
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=statuspage:tenant-admin-service
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      # Service URLs for inter-service communication
      - COMPONENT_SERVICE_URL=http://component-service:8001
      - INCIDENT_SERVICE_URL=http://incident-service:8002
      - MONITORING_SERVICE_URL=http://monitoring-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8004
      - BRANDING_SERVICE_URL=http://branding-service:8005
    depends_on:
      - postgres
      - redis
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Component Service
  component-service:
    build:
      context: .
      dockerfile: Dockerfile.component-service
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_components
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=statuspage:component-service
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - postgres
      - redis
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Incident Service
  incident-service:
    build:
      context: .
      dockerfile: Dockerfile.incident-service
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_incidents
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=statuspage:incident-service
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - postgres
      - redis
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification-service
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_notifications
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=statuspage:notification-service
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=your_email@gmail.com
      - SMTP_PASSWORD=your_app_password
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - postgres
      - redis
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment-service
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_payments
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=statuspage:payment-service
      - STRIPE_SECRET_KEY=sk_test_your_stripe_secret_key
      - STRIPE_WEBHOOK_SECRET=whsec_your_webhook_secret
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - postgres
      - redis
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.analytics-service
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_analytics
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=statuspage:analytics-service
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=your_influx_token
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - postgres
      - redis
      - influxdb
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Monitoring Service
  monitoring-service:
    build:
      context: .
      dockerfile: Dockerfile.monitoring-service
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_monitoring
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=statuspage:monitoring-service
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - postgres
      - redis
      - consul
      - jaeger
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=statuspage_user
      - POSTGRES_PASSWORD=statuspage_password
      - POSTGRES_DB=statuspage_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./microservices/database-service/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statuspage_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - statuspage-network

  # Database Management Service
  database-service:
    build:
      context: ./microservices/database-service
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      - ENVIRONMENT=development
      - SERVER_PORT=8089
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=statuspage_management
      - DB_USER=statuspage_user
      - DB_PASSWORD=statuspage_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUL_ADDR=consul:8500
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - statuspage-network
    volumes:
      - ./configs:/app/configs:ro
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - statuspage-network
    restart: unless-stopped

  # Consul for Service Discovery
  consul:
    image: consul:1.16
    command: consul agent -server -bootstrap-expect=1 -ui -bind=0.0.0.0 -client=0.0.0.0
    ports:
      - "8500:8500"
    volumes:
      - consul_data:/consul/data
    networks:
      - statuspage-network
    restart: unless-stopped

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.49
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - statuspage-network
    restart: unless-stopped

  # InfluxDB for Time Series Data
  influxdb:
    image: influxdb:2.7
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=statuspage
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - statuspage-network
    restart: unless-stopped

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - statuspage-network
    restart: unless-stopped

  # Grafana for Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - statuspage-network
    restart: unless-stopped

  # Kafka for Event Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - statuspage-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - statuspage-network
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - statuspage-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  consul_data:
  influxdb_data:
  prometheus_data:
  grafana_data:

networks:
  statuspage-network:
    driver: bridge