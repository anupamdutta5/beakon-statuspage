  # Payment Service (Port 8087)
  payment-service:
    build:
      context: ./microservices/payment-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8087
        CMD ["./main"]
    ports:
      - "8087:8087"
    environment:
      - ENVIRONMENT=development
      - PORT=8087
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
      - DB_NAME=statuspage_payments
    depends_on:
      - postgres
    networks:
