  # === INFRASTRUCTURE SERVICES ===

  # SaaS Admin Service (Port 8089)
  saas-admin-service:
    build:
      context: ./microservices/saas-admin-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /app/main .
        EXPOSE 8089
        CMD ["./main"]
    ports:
      - "8089:8089"
    environment:
      - ENVIRONMENT=development
      - PORT=8089
      - DB_HOST=postgres
      - DB_PASSWORD=statuspage_password
    depends_on:
      - postgres
    networks:
      - statuspage-network
    restart: unless-stopped

  # Tenant Admin Service (Port 8090)
  tenant-admin-service:
    build:
      context: ./microservices/tenant-admin-service
      dockerfile_inline: |
        FROM golang:1.25.0-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -o main cmd/main.go
        FROM alpine:3.18
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
