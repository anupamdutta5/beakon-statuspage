name: Performance Tests

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM UTC
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test to run'
        required: true
        type: choice
        options:
          - all
          - status-page-load
          - notification-burst
          - incident-spike
          - database-pool-stress

jobs:
  setup-environment:
    name: Setup Performance Test Environment
    runs-on: ubuntu-latest
    outputs:
      test-url: ${{ steps.setup.outputs.test_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up test environment
        id: setup
        run: |
          echo "test_url=http://localhost" >> $GITHUB_OUTPUT

  k6-status-page-load:
    name: K6 - Status Page Load Test
    runs-on: ubuntu-latest
    needs: setup-environment
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'status-page-load' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup databases
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          cd microservices
          ./init-all-databases.sh

      - name: Build and start services
        run: |
          # Build tenant-admin-service
          cd microservices/tenant-admin-service
          go build -o tenant-admin-service cmd/main.go

          # Start service
          DB_HOST=localhost DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres \
          DB_NAME=tenant_admin_db REDIS_HOST=localhost REDIS_PORT=6379 \
          SERVER_PORT=8099 ./tenant-admin-service > tenant-admin.log 2>&1 &

          cd ../..
          sleep 10

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run status page load test
        run: |
          cd tests/load
          k6 run --out json=status-page-load-results.json status-page-load.js

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: status-page-load-results
          path: tests/load/status-page-load-results.json
          retention-days: 30

      - name: Parse and report results
        run: |
          echo "## Status Page Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f tests/load/status-page-load-results.json ]; then
            echo "Test completed. Results uploaded to artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Test results not found" >> $GITHUB_STEP_SUMMARY
          fi

  k6-notification-burst:
    name: K6 - Notification Burst Test
    runs-on: ubuntu-latest
    needs: setup-environment
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'notification-burst' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup databases
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          cd microservices
          ./init-all-databases.sh

      - name: Build and start notification-service
        run: |
          cd microservices/notification-service
          go build -o notification-service cmd/main.go

          DB_HOST=localhost DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres \
          DB_NAME=statuspage_notification RABBITMQ_HOST=localhost RABBITMQ_PORT=5672 \
          SERVER_PORT=8085 ./notification-service > notification.log 2>&1 &

          cd ../..
          sleep 10

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run notification burst test
        run: |
          cd tests/load
          k6 run --out json=notification-burst-results.json notification-burst.js

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: notification-burst-results
          path: tests/load/notification-burst-results.json
          retention-days: 30

  k6-incident-spike:
    name: K6 - Incident Spike Test
    runs-on: ubuntu-latest
    needs: setup-environment
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'incident-spike' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup databases
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          cd microservices
          ./init-all-databases.sh

      - name: Build and start incident-service
        run: |
          cd microservices/incident-service
          go build -o incident-service cmd/main.go

          DB_HOST=localhost DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres \
          DB_NAME=statuspage_incident SERVER_PORT=8086 ./incident-service > incident.log 2>&1 &

          cd ../..
          sleep 10

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run incident spike test
        run: |
          cd tests/load
          k6 run --out json=incident-spike-results.json incident-spike.js

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: incident-spike-results
          path: tests/load/incident-spike-results.json
          retention-days: 30

  k6-database-pool-stress:
    name: K6 - Database Pool Stress Test
    runs-on: ubuntu-latest
    needs: setup-environment
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'database-pool-stress' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup databases
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          cd microservices
          ./init-all-databases.sh

      - name: Build and start tenant-admin-service
        run: |
          cd microservices/tenant-admin-service
          go build -o tenant-admin-service cmd/main.go

          DB_HOST=localhost DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres \
          DB_NAME=tenant_admin_db REDIS_HOST=localhost REDIS_PORT=6379 \
          SERVER_PORT=8099 ./tenant-admin-service > tenant-admin.log 2>&1 &

          cd ../..
          sleep 10

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run database pool stress test
        run: |
          cd tests/load
          k6 run --out json=database-pool-stress-results.json database-pool-stress.js

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: database-pool-stress-results
          path: tests/load/database-pool-stress-results.json
          retention-days: 30

  performance-summary:
    name: Performance Test Summary
    runs-on: ubuntu-latest
    needs: [k6-status-page-load, k6-notification-burst, k6-incident-spike, k6-database-pool-stress]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v3

      - name: Generate summary report
        run: |
          echo "## Performance Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test execution completed. Individual results:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.k6-status-page-load.result }}" == "success" ]; then
            echo "✅ Status Page Load Test - PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Status Page Load Test - FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.k6-notification-burst.result }}" == "success" ]; then
            echo "✅ Notification Burst Test - PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Notification Burst Test - FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.k6-incident-spike.result }}" == "success" ]; then
            echo "✅ Incident Spike Test - PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Incident Spike Test - FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.k6-database-pool-stress.result }}" == "success" ]; then
            echo "✅ Database Pool Stress Test - PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Database Pool Stress Test - FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Detailed results are available in the artifacts section." >> $GITHUB_STEP_SUMMARY
