name: Security Scan

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  push:
    branches: [main, develop]
    paths:
      - 'microservices/**/*.go'
      - 'microservices/**/go.mod'
      - 'microservices/**/go.sum'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gosec:
    name: Go Security Scan (gosec)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - tenant-admin-service
          - saas-admin-service
          - landing-page-service
          - component-service
          - incident-service
          - notification-service
          - monitoring-service
          - payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec-results-${{ matrix.service }}.sarif ./...'
        continue-on-error: true
        env:
          GOPATH: ${{ github.workspace }}/go
          GO111MODULE: on
        working-directory: microservices/${{ matrix.service }}

      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: microservices/${{ matrix.service }}/gosec-results-${{ matrix.service }}.sarif
        if: always()

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - tenant-admin-service
          - saas-admin-service
          - landing-page-service
          - component-service
          - incident-service
          - notification-service
          - monitoring-service
          - payment-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: microservices/${{ matrix.service }}
        run: |
          echo "## Vulnerability Scan Results for ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          govulncheck ./... | tee vuln-results.txt
          if [ $? -ne 0 ]; then
            echo "::warning::Vulnerabilities found in ${{ matrix.service }}"
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat vuln-results.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        service:
          - tenant-admin-service
          - saas-admin-service
          - notification-service
          - monitoring-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: microservices/${{ matrix.service }}
        run: |
          if [ -f Dockerfile ]; then
            docker build -t ${{ matrix.service }}:test .
          else
            echo "No Dockerfile found for ${{ matrix.service }}, skipping"
            exit 0
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:test
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
        if: always()

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - tenant-admin-service
          - saas-admin-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        working-directory: microservices/${{ matrix.service }}
        run: |
          echo "## License Report for ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          go-licenses report ./... > licenses.csv 2>&1 || true
          if [ -f licenses.csv ]; then
            echo "Found licenses:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat licenses.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [gosec, dependency-check, secret-scan, docker-scan, codeql, license-check]
    if: always()

    steps:
      - name: Check all security scans
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=0

          if [ "${{ needs.gosec.result }}" == "failure" ]; then
            echo "❌ gosec scan failed" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ gosec scan passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.dependency-check.result }}" == "failure" ]; then
            echo "❌ Dependency vulnerability check failed" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ Dependency vulnerability check passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.secret-scan.result }}" == "failure" ]; then
            echo "❌ Secret scanning failed" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ Secret scanning passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.docker-scan.result }}" == "failure" ]; then
            echo "⚠️ Docker image scanning found issues" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ Docker image scanning passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.codeql.result }}" == "failure" ]; then
            echo "❌ CodeQL analysis failed" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ CodeQL analysis passed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.license-check.result }}" == "failure" ]; then
            echo "⚠️ License check found issues" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ License check passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $FAILED -eq 1 ]; then
            echo "::error::Some security scans failed or found issues"
            echo "**Action Required:** Review security findings above" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "::notice::All security scans passed!"
            echo "**Status:** All security checks passed ✅" >> $GITHUB_STEP_SUMMARY
          fi
