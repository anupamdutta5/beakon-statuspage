name: Integration Tests

on:
  push:
    branches: [develop]
    paths:
      - 'microservices/**/*.go'
      - 'tests/integration/**'
      - 'tests/docker-compose.test.yml'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'microservices/**/*.go'
      - 'tests/integration/**'

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.12-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up test databases
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          cd microservices
          ./init-all-databases.sh

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

          echo "Waiting for Redis..."
          until redis-cli -h localhost -p 6379 ping; do
            sleep 2
          done

          echo "Waiting for RabbitMQ..."
          until curl -f http://localhost:15672/api/overview -u guest:guest; do
            sleep 2
          done

      - name: Run tenant-admin-service integration tests
        working-directory: microservices/tenant-admin-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: tenant_admin_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
        run: |
          if [ -d "tests/integration" ]; then
            go test ./tests/integration/... -v -race
          else
            echo "No integration tests found for tenant-admin-service"
          fi

      - name: Run saas-admin-service integration tests
        working-directory: microservices/saas-admin-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: saas_admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
        run: |
          if [ -d "tests/integration" ]; then
            go test ./tests/integration/... -v -race
          else
            echo "No integration tests found for saas-admin-service"
          fi

      - name: Run notification-service integration tests
        working-directory: microservices/notification-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: statuspage_notification
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
        run: |
          if [ -d "tests/integration" ]; then
            go test ./tests/integration/... -v -race
          else
            echo "No integration tests found for notification-service"
          fi

      - name: Run monitoring-service integration tests
        working-directory: microservices/monitoring-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: statuspage_monitoring
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          if [ -d "tests/integration" ]; then
            go test ./tests/integration/... -v -race
          else
            echo "No integration tests found for monitoring-service"
          fi

  database-integration:
    name: Database Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test database migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          cd tests/helpers
          ./test-db-migrations.sh

      - name: Test database connections
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          cd tests/helpers
          ./test-db-connections.sh

  message-queue-integration:
    name: Message Queue Integration Tests
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3.12-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for RabbitMQ
        run: |
          until curl -f http://localhost:15672/api/overview -u guest:guest; do
            echo "Waiting for RabbitMQ..."
            sleep 2
          done

      - name: Test RabbitMQ connectivity
        run: |
          cd tests/helpers
          chmod +x test-rabbitmq.sh
          ./test-rabbitmq.sh

  cache-integration:
    name: Cache Integration Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Redis connectivity
        run: |
          cd tests/helpers
          chmod +x test-redis.sh
          ./test-redis.sh

  test-summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: [integration-tests, database-integration, message-queue-integration, cache-integration]
    if: always()

    steps:
      - name: Check all test results
        run: |
          FAILED=0

          if [ "${{ needs.integration-tests.result }}" == "failure" ]; then
            echo "::error::Integration tests failed"
            FAILED=1
          fi

          if [ "${{ needs.database-integration.result }}" == "failure" ]; then
            echo "::error::Database integration tests failed"
            FAILED=1
          fi

          if [ "${{ needs.message-queue-integration.result }}" == "failure" ]; then
            echo "::error::Message queue integration tests failed"
            FAILED=1
          fi

          if [ "${{ needs.cache-integration.result }}" == "failure" ]; then
            echo "::error::Cache integration tests failed"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          else
            echo "::notice::All integration tests passed!"
          fi
