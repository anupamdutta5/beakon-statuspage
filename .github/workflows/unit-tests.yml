name: Unit Tests

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'microservices/**/*.go'
      - 'microservices/**/go.mod'
      - 'microservices/**/go.sum'
      - '.github/workflows/unit-tests.yml'
  push:
    branches: [develop]
    paths:
      - 'microservices/**/*.go'
      - 'microservices/**/go.mod'
      - 'microservices/**/go.sum'

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - tenant-admin-service
          - saas-admin-service
          - landing-page-service
          - branding-service
          - component-service
          - incident-service
          - notification-service
          - monitoring-service
          - event-store-service
          - payment-service
          - analytics-service
          - database-service
          - audit-consumer
          - analytics-consumer
          - notification-consumer
          - billing-consumer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: microservices/${{ matrix.service }}/go.sum

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles(format('microservices/{0}/go.sum', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: microservices/${{ matrix.service }}
        run: go mod download

      - name: Verify dependencies
        working-directory: microservices/${{ matrix.service }}
        run: go mod verify

      - name: Run unit tests
        working-directory: microservices/${{ matrix.service }}
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic

      - name: Generate coverage report
        working-directory: microservices/${{ matrix.service }}
        run: |
          go tool cover -func=coverage.out > coverage.txt
          echo "## Coverage Report for ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: microservices/${{ matrix.service }}/coverage.out
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
          fail_ci_if_error: false

      - name: Check test coverage threshold
        working-directory: microservices/${{ matrix.service }}
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

          # Minimum coverage threshold: 60%
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold of 60%"
            exit 1
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.unit-tests.result }}" == "failure" ]; then
            echo "::error::Some unit tests failed"
            exit 1
          elif [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "::notice::All unit tests passed!"
          fi
