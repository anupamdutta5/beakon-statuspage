<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Debug</title>
    <style>
        .sidebar { width: 200px; float: left; background: #f0f0f0; padding: 20px; }
        .nav-link { display: block; padding: 10px; text-decoration: none; color: #333; }
        .nav-link:hover { background: #e0e0e0; }
        .nav-item.active .nav-link { background: #007bff; color: white; }
        .content-section { display: none; padding: 20px; margin-left: 240px; }
        .content-section.active { display: block; }
        .main-content { margin-left: 220px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <ul class="sidebar-nav">
            <li class="nav-item active">
                <a href="#dashboard" class="nav-link">Dashboard</a>
            </li>
            <li class="nav-item">
                <a href="#components" class="nav-link">Components</a>
            </li>
            <li class="nav-item">
                <a href="#incidents" class="nav-link">Incidents</a>
            </li>
        </ul>
    </div>
    
    <div class="main-content">
        <div id="dashboard" class="content-section">
            <h2>Dashboard Content</h2>
            <p>This is the dashboard content.</p>
        </div>
        
        <div id="components" class="content-section">
            <h2>Components Content</h2>
            <p>This is the components content.</p>
        </div>
        
        <div id="incidents" class="content-section">
            <h2>Incidents Content</h2>
            <p>This is the incidents content.</p>
        </div>
    </div>

    <script>
        console.log('Debug navigation script loaded');
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, setting up navigation...');
            
            // Handle sidebar navigation clicks
            document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    console.log('Navigation link clicked:', link.getAttribute('href'));
                    e.preventDefault();
                    const href = link.getAttribute('href');
                    
                    if (href.startsWith('#')) {
                        const section = href.substring(1);
                        console.log('Navigating to section:', section);
                        navigateToSection(section);
                    }
                });
            });
        });
        
        function navigateToSection(section) {
            console.log('navigateToSection called with:', section);
            
            // Update active nav item
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            const activeLink = document.querySelector(`.sidebar-nav .nav-link[href="#${section}"]`);
            if (activeLink) {
                activeLink.closest('.nav-item').classList.add('active');
                console.log('Updated active nav item');
            }

            // Hide all content sections
            const allSections = document.querySelectorAll('.content-section');
            console.log('Found content sections:', allSections.length);
            allSections.forEach(section => {
                console.log('Hiding section:', section.id);
                section.style.display = 'none';
            });

            // Show the selected section
            const targetSection = document.getElementById(section);
            if (targetSection) {
                targetSection.style.display = 'block';
                console.log('Showing section:', section);
            } else {
                console.log('Section not found:', section);
            }

            // Update URL without page reload
            history.pushState({ section }, '', `#${section}`);
        }
    </script>
</body>
</html>
