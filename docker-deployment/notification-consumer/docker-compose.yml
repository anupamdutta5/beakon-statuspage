version: '3.8'

services:
  notification-consumer:
    image: beakon-notification-consumer:latest
    container_name: beakon-notification-consumer
    build:
      context: ../../microservices
      dockerfile: notification-consumer/build/Dockerfile
    volumes:
      - ./configs:/app/configs:ro
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DB_HOST=${DB_HOST:-statuspage-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=statuspage_notification
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-for-testing-only-change-in-production-min-32-chars}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
    networks:
      - beakon-network
    restart: unless-stopped

networks:
  beakon-network:
    name: beakon-network
    external: true
