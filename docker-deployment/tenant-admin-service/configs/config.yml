server:
  port: 8099
  environment: development

database:
  host: ${DB_HOST:-postgres}
  port: ${DB_PORT:-5432}
  user: ${DB_USER:-postgres}
  password: ${DB_PASSWORD:-postgres}
  name: ${DB_NAME:-tenant_admin_db}
  ssl_mode: ${DB_SSLMODE:-disable}

redis:
  host: beakon-redis
  port: 6379
  enabled: true
  password: ${REDIS_PASSWORD}

rabbitmq:
  host: beakon-rabbitmq
  port: 5672
  user: guest
  password: guest

jwt:
  secret: dev-secret-for-testing-only-change-in-production-min-32-chars

tenant:
  default_plan: free
  max_users: 5

logging:
  level: info
