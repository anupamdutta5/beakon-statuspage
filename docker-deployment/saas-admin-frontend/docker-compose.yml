version: '3.8'

services:
  saas-admin-frontend:
    image: beakon-saas-admin-frontend:latest
    container_name: beakon-saas-admin-frontend
    build:
      context: ../../microservices
      dockerfile: saas-admin-frontend/build/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./configs:/app/configs:ro
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8098}
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
    networks:
      - beakon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  beakon-network:
    name: beakon-network
    external: true
